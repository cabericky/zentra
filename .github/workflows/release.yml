name: Release & Package Zentra

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build & Package Tauri Application (NSIS & MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Zentra ${{ github.ref_name }}'
          releaseBody: |
            ## Zentra Screen Studio for Windows
            Automated production build generated by GitHub Actions.

            ### Included Installers:
            - **NSIS Setup (.exe)**: Standard user-friendly installer.
            - **WiX Installer (.msi)**: Enterprise/Windows Installer package.
            - **Updater Metadata**: Auto-updater artifacts (`latest.json` and `.sig`).
          releaseDraft: false
          prerelease: false